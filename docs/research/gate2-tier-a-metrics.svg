<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Gate 2 tier A scored against a labelled corpus of 45 registries</title>
  <desc id="desc">Twenty-seven registries carry a defect and eighteen are legitimate runs. The gate rejected all twenty-seven on the correct key and passed all eighteen, giving a detection rate of 100 percent with a Wilson 95 percent interval of 87.5 to 100, a false positive rate of 0 percent with an interval of 0 to 17.6, specificity of 100 percent with an interval of 82.4 to 100, and accuracy of 100 percent over 45 cases with an interval of 92.1 to 100. The intervals are wide because the corpus is small.</desc>
  <rect width="1000" height="580" fill="#fcfcfb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#111111">

    <text x="40" y="42" font-size="24" font-weight="700">Gate 2 tier A, scored against a labelled corpus</text>
    <text x="40" y="66" font-size="14" fill="#555555">45 registries: 27 carrying a known defect, 18 legitimate runs sitting on the boundaries. A defect counts as caught only when the gate names the right key.</text>

    <!-- confusion matrix -->
    <text x="40" y="108" font-size="12" fill="#6b6b68" letter-spacing="0.4">CONFUSION MATRIX</text>
    <g font-size="13">
      <text x="243" y="134" fill="#6b6b68" text-anchor="end">gate rejected</text>
      <text x="373" y="134" fill="#6b6b68" text-anchor="end">gate passed</text>

      <rect x="150" y="142" width="110" height="46" rx="4" fill="#2a78d6"/>
      <rect x="264" y="142" width="110" height="46" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <text x="40" y="171" fill="#111111">has a defect</text>
      <text x="205" y="172" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">27</text>
      <text x="319" y="172" font-size="20" font-weight="700" fill="#b9b9b4" text-anchor="middle">0</text>

      <rect x="150" y="192" width="110" height="46" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <rect x="264" y="192" width="110" height="46" rx="4" fill="#2a78d6"/>
      <text x="40" y="221" fill="#111111">is legitimate</text>
      <text x="205" y="222" font-size="20" font-weight="700" fill="#b9b9b4" text-anchor="middle">0</text>
      <text x="319" y="222" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">18</text>

      <text x="40" y="262" font-size="12" fill="#6b6b68">Off-diagonal is empty: no defect slipped through, no honest run was rejected.</text>
    </g>

    <!-- rates with Wilson intervals -->
    <text x="480" y="108" font-size="12" fill="#6b6b68" letter-spacing="0.4">RATES, WITH WILSON 95% INTERVALS</text>

    <g stroke="#e4e4e0" stroke-width="1">
      <line x1="560" y1="120" x2="560" y2="250"/>
      <line x1="645" y1="120" x2="645" y2="250"/>
      <line x1="730" y1="120" x2="730" y2="250"/>
      <line x1="815" y1="120" x2="815" y2="250"/>
    </g>
    <line x1="900" y1="120" x2="900" y2="250" stroke="#c9c9c4" stroke-width="1"/>

    <g font-size="11" fill="#6b6b68" text-anchor="middle">
      <text x="560" y="266">0%</text><text x="645" y="266">25%</text><text x="730" y="266">50%</text>
      <text x="815" y="266">75%</text><text x="900" y="266">100%</text>
    </g>

    <g font-size="13">
      <!-- detection rate: 100%, CI 87.5-100, n=27 -->
      <text x="550" y="140" text-anchor="end">detection rate</text>
      <line x1="857.5" y1="136" x2="900" y2="136" stroke="#a9c7ec" stroke-width="6" stroke-linecap="round"/>
      <circle cx="900" cy="136" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="915" y="140" font-size="12" fill="#555555">100%  n=27</text>

      <!-- specificity: 100%, CI 82.4-100, n=18 -->
      <text x="550" y="170" text-anchor="end">specificity</text>
      <line x1="840.2" y1="166" x2="900" y2="166" stroke="#a9c7ec" stroke-width="6" stroke-linecap="round"/>
      <circle cx="900" cy="166" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="915" y="170" font-size="12" fill="#555555">100%  n=18</text>

      <!-- precision: 100%, CI 87.5-100, n=27 -->
      <text x="550" y="200" text-anchor="end">precision</text>
      <line x1="857.5" y1="196" x2="900" y2="196" stroke="#a9c7ec" stroke-width="6" stroke-linecap="round"/>
      <circle cx="900" cy="196" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="915" y="200" font-size="12" fill="#555555">100%  n=27</text>

      <!-- accuracy: 100%, CI 92.1-100, n=45 -->
      <text x="550" y="230" text-anchor="end">accuracy</text>
      <line x1="871.4" y1="226" x2="900" y2="226" stroke="#a9c7ec" stroke-width="6" stroke-linecap="round"/>
      <circle cx="900" cy="226" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="915" y="230" font-size="12" fill="#555555">100%  n=45</text>
    </g>

    <!-- false positive rate, lower is better, on its own line -->
    <text x="480" y="306" font-size="12" fill="#6b6b68" letter-spacing="0.4">FALSE POSITIVE RATE &#183; LOWER IS BETTER</text>
    <g stroke="#e4e4e0" stroke-width="1">
      <line x1="560" y1="316" x2="560" y2="348"/>
      <line x1="645" y1="316" x2="645" y2="348"/>
      <line x1="730" y1="316" x2="730" y2="348"/>
      <line x1="815" y1="316" x2="815" y2="348"/>
    </g>
    <line x1="900" y1="316" x2="900" y2="348" stroke="#c9c9c4" stroke-width="1"/>
    <g font-size="13">
      <text x="550" y="337" text-anchor="end">legitimate runs rejected</text>
      <line x1="560" y1="333" x2="619.8" y2="333" stroke="#a9c7ec" stroke-width="6" stroke-linecap="round"/>
      <circle cx="560" cy="333" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="915" y="337" font-size="12" fill="#555555">0%  n=18</text>
    </g>

    <line x1="40" y1="386" x2="960" y2="386" stroke="#c9c9c4" stroke-width="1.5"/>

    <text x="40" y="414" font-size="14" font-weight="600">How to read the intervals, and what these numbers do not say</text>
    <g font-size="13" fill="#555555">
      <text x="40" y="440">Every rate is 100%, and every interval is wide, because the corpus is small. Specificity of 18/18 is consistent with a true rate</text>
      <text x="40" y="460">as low as 82.4%, and a false positive rate of 0/18 is consistent with one as high as 17.6%. The point estimate is not the finding;</text>
      <text x="40" y="480">the interval is. Reporting 100% without its denominator would be the overclaim this gate exists to catch.</text>
      <text x="40" y="508">The positive half measures coverage, not skill: tier A is deterministic, so a recall figure over defects we wrote is close to</text>
      <text x="40" y="528">circular. The negative half is the real measurement. Nothing guarantees a bound rejects only what it should, and its 18 fixtures</text>
      <text x="40" y="548">sit on the boundaries on purpose: accuracy exactly 1.0, loss exactly 0.0, perplexity exactly 1.0, a speedup exactly at the ceiling.</text>
    </g>
    <text x="40" y="572" font-size="12" fill="#6b6b68">Reproduce: python -m rig.gate2_tier_a_eval</text>
  </g>
</svg>
