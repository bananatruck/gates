<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Gate 2 tier A: defect coverage before and after</title>
  <desc id="desc">Twelve fixtures, one per defect class, run through run_gate2 at commit 2da4eff and again at 11da445. Seven behaved as specified before, twelve after. Five defect classes moved from missed to caught: sub-unit perplexity, f1 above one, infinite loss, a NaN speedup that previously failed on the wrong key, and an unexplained speedup. Three fixtures are legitimate runs the gate must not reject, and none is rejected in either state. Tier A adds a median 0.145 milliseconds per registry and makes zero model calls.</desc>
  <rect width="1000" height="650" fill="#fcfcfb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#111111">

    <text x="40" y="42" font-size="24" font-weight="700">Gate 2 tier A: defect coverage before and after</text>
    <text x="40" y="66" font-size="14" fill="#555555">One fixture per defect class, run through run_gate2. A fixture counts as caught only when the gate names the right key.</text>

    <!-- headline measures -->
    <g>
      <rect x="40" y="88" width="216" height="72" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <text x="56" y="110" font-size="12" fill="#6b6b68" letter-spacing="0.4">DEFECT COVERAGE</text>
      <text x="56" y="142" font-size="26" font-weight="700">7/12 &#8594; 12/12</text>

      <rect x="268" y="88" width="216" height="72" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <text x="284" y="110" font-size="12" fill="#6b6b68" letter-spacing="0.4">SUITE PASSING</text>
      <text x="284" y="142" font-size="26" font-weight="700">395 &#8594; 426</text>

      <rect x="496" y="88" width="216" height="72" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <text x="512" y="110" font-size="12" fill="#6b6b68" letter-spacing="0.4">TIER A LATENCY, 40 VALUES</text>
      <text x="512" y="142" font-size="26" font-weight="700">0.145 ms</text>
      <text x="646" y="142" font-size="13" fill="#6b6b68">median</text>

      <rect x="724" y="88" width="216" height="72" rx="4" fill="#ffffff" stroke="#e4e4e0"/>
      <text x="740" y="110" font-size="12" fill="#6b6b68" letter-spacing="0.4">MODEL CALLS</text>
      <text x="740" y="142" font-size="26" font-weight="700">0</text>
      <text x="762" y="142" font-size="13" fill="#6b6b68">by construction</text>
    </g>

    <!-- legend: state is never carried by colour alone; every cell is labelled -->
    <g font-size="13">
      <rect x="40" y="186" width="12" height="12" rx="3" fill="#2a78d6"/><text x="60" y="197">caught, and names the right key</text>
      <rect x="286" y="186" width="12" height="12" rx="3" fill="#eb6834"/><text x="306" y="197">missed, or failed on another key</text>
      <rect x="540" y="186" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="560" y="197">legitimate run, must not be rejected</text>
    </g>

    <!-- column headers -->
    <g font-size="12" fill="#6b6b68" letter-spacing="0.4">
      <text x="40" y="232">DEFECT CLASS</text>
      <text x="392" y="232">BEFORE &#183; 2da4eff</text>
      <text x="574" y="232">AFTER &#183; 11da445</text>
      <text x="756" y="232">CHECK THAT CATCHES IT</text>
    </g>
    <line x1="40" y1="240" x2="960" y2="240" stroke="#c9c9c4" stroke-width="1.5"/>

    <g font-size="13">
      <!-- five classes that moved from missed to caught -->
      <text x="40" y="265">sub-unit perplexity</text>
      <rect x="392" y="255" width="12" height="12" rx="3" fill="#eb6834"/><text x="412" y="265" fill="#555555">missed</text>
      <rect x="574" y="255" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="265" fill="#555555">caught</text>
      <text x="756" y="265" fill="#555555">coherence.range_valid</text>

      <text x="40" y="290">f1 above one</text>
      <rect x="392" y="280" width="12" height="12" rx="3" fill="#eb6834"/><text x="412" y="290" fill="#555555">missed</text>
      <rect x="574" y="280" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="290" fill="#555555">caught</text>
      <text x="756" y="290" fill="#555555">coherence.range_valid</text>

      <text x="40" y="315">infinite loss</text>
      <rect x="392" y="305" width="12" height="12" rx="3" fill="#eb6834"/><text x="412" y="315" fill="#555555">missed</text>
      <rect x="574" y="305" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="315" fill="#555555">caught</text>
      <text x="756" y="315" fill="#555555">coherence.range_valid</text>

      <text x="40" y="340">NaN speedup from a zero divisor</text>
      <rect x="392" y="330" width="12" height="12" rx="3" fill="#eb6834"/><text x="412" y="340" fill="#555555">wrong key</text>
      <rect x="574" y="330" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="340" fill="#555555">caught</text>
      <text x="756" y="340" fill="#555555">coherence.range_valid</text>

      <text x="40" y="365">unexplained speedup</text>
      <rect x="392" y="355" width="12" height="12" rx="3" fill="#eb6834"/><text x="412" y="365" fill="#555555">missed</text>
      <rect x="574" y="355" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="365" fill="#555555">caught</text>
      <text x="756" y="365" fill="#555555">coherence.plausibility</text>

      <!-- four already caught -->
      <text x="40" y="398">accuracy above one</text>
      <rect x="392" y="388" width="12" height="12" rx="3" fill="#2a78d6"/><text x="412" y="398" fill="#555555">caught</text>
      <rect x="574" y="388" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="398" fill="#555555">caught</text>
      <text x="756" y="398" fill="#555555">coherence.range_valid</text>

      <text x="40" y="423">negative loss</text>
      <rect x="392" y="413" width="12" height="12" rx="3" fill="#2a78d6"/><text x="412" y="423" fill="#555555">caught</text>
      <rect x="574" y="413" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="423" fill="#555555">caught</text>
      <text x="756" y="423" fill="#555555">coherence.range_valid</text>

      <text x="40" y="448">unmeasured wallclock</text>
      <rect x="392" y="438" width="12" height="12" rx="3" fill="#2a78d6"/><text x="412" y="448" fill="#555555">caught</text>
      <rect x="574" y="438" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="448" fill="#555555">caught</text>
      <text x="756" y="448" fill="#555555">coherence.range_valid</text>

      <text x="40" y="473">broken arithmetic relation</text>
      <rect x="392" y="463" width="12" height="12" rx="3" fill="#2a78d6"/><text x="412" y="473" fill="#555555">caught</text>
      <rect x="574" y="463" width="12" height="12" rx="3" fill="#2a78d6"/><text x="594" y="473" fill="#555555">caught</text>
      <text x="756" y="473" fill="#555555">coherence.internal_consistency</text>

      <!-- three legitimate runs -->
      <text x="40" y="506">clean run</text>
      <rect x="392" y="496" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="412" y="506" fill="#555555">passes</text>
      <rect x="574" y="496" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="594" y="506" fill="#555555">passes</text>
      <text x="756" y="506" fill="#6b6b68">must not be rejected</text>

      <text x="40" y="531">SAGE's real 4,700x, derived</text>
      <rect x="392" y="521" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="412" y="531" fill="#555555">passes</text>
      <rect x="574" y="521" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="594" y="531" fill="#555555">passes</text>
      <text x="756" y="531" fill="#6b6b68">exempt: a relation derives it</text>

      <text x="40" y="556">unit the gate has no range for</text>
      <rect x="392" y="546" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="412" y="556" fill="#555555">unchecked</text>
      <rect x="574" y="546" width="12" height="12" rx="3" fill="#4a3aa7"/><text x="594" y="556" fill="#555555">unchecked</text>
      <text x="756" y="556" fill="#6b6b68">reported, never green</text>
    </g>

    <line x1="40" y1="378" x2="960" y2="378" stroke="#e4e4e0" stroke-width="1"/>
    <line x1="40" y1="486" x2="960" y2="486" stroke="#e4e4e0" stroke-width="1"/>
    <line x1="40" y1="572" x2="960" y2="572" stroke="#c9c9c4" stroke-width="1.5"/>

    <text x="40" y="596" font-size="12" fill="#6b6b68">Reproduce: python -m rig.gate2_tier_a_evidence</text>
    <text x="40" y="614" font-size="12" fill="#6b6b68">Latency: 200 runs per size, one machine, including the report write to disk, so it is an upper bound.</text>
    <text x="40" y="632" font-size="12" fill="#6b6b68">"Wrong key": the report failed on the zero wallclock, not the NaN speedup derived from it. On verdict alone, before would read 8/12.</text>
  </g>
</svg>
