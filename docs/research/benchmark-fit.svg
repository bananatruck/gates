<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark fit for evaluating G.A.T.E.S.</title>
  <desc id="desc">Stacked horizontal bars score five benchmarks from zero to ten on direct coverage of execution validity, source-result coherence, numeric and citation binding, semantic claim auditing, and end-to-end research realism.</desc>
  <rect width="1000" height="540" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#111111">
    <text x="40" y="42" font-size="24" font-weight="700">Benchmark fit for evaluating G.A.T.E.S.</text>
    <text x="40" y="68" font-size="14" fill="#555555">Analytical coverage rubric: 0 = none, 1 = partial, 2 = direct per dimension; maximum 10</text>

    <g font-size="13">
      <rect x="40" y="87" width="14" height="14" fill="#4c78a8"/><text x="61" y="99">Gate 1 execution</text>
      <rect x="190" y="87" width="14" height="14" fill="#f58518"/><text x="211" y="99">Gate 2 source-result</text>
      <rect x="380" y="87" width="14" height="14" fill="#54a24b"/><text x="401" y="99">Gate 3 numeric/citation</text>
      <rect x="610" y="87" width="14" height="14" fill="#e45756"/><text x="631" y="99">Semantic audit</text>
      <rect x="760" y="87" width="14" height="14" fill="#b279a2"/><text x="781" y="99">End-to-end realism</text>
    </g>

    <g stroke="#dddddd" stroke-width="1">
      <line x1="220" y1="125" x2="220" y2="455"/>
      <line x1="340" y1="125" x2="340" y2="455"/>
      <line x1="460" y1="125" x2="460" y2="455"/>
      <line x1="580" y1="125" x2="580" y2="455"/>
      <line x1="700" y1="125" x2="700" y2="455"/>
      <line x1="820" y1="125" x2="820" y2="455"/>
    </g>

    <g font-size="14" fill="#666666" text-anchor="middle">
      <text x="220" y="478">0</text><text x="340" y="478">2</text><text x="460" y="478">4</text>
      <text x="580" y="478">6</text><text x="700" y="478">8</text><text x="820" y="478">10</text>
    </g>

    <g font-size="16" font-weight="600" text-anchor="end">
      <text x="205" y="157">MLR-Bench</text>
      <text x="205" y="222">ARC-Bench</text>
      <text x="205" y="287">BadScientist</text>
      <text x="205" y="352">CORE-Bench</text>
      <text x="205" y="417">SPOT</text>
    </g>

    <g>
      <!-- MLR-Bench: 2 + 1 + 2 + 2 + 2 = 9 -->
      <rect x="220" y="133" width="120" height="34" fill="#4c78a8"/>
      <rect x="340" y="133" width="60" height="34" fill="#f58518"/>
      <rect x="400" y="133" width="120" height="34" fill="#54a24b"/>
      <rect x="520" y="133" width="120" height="34" fill="#e45756"/>
      <rect x="640" y="133" width="120" height="34" fill="#b279a2"/>
      <text x="773" y="157" font-size="16" font-weight="700">9</text>

      <!-- ARC-Bench: 2 + 1 + 1 + 2 + 2 = 8 -->
      <rect x="220" y="198" width="120" height="34" fill="#4c78a8"/>
      <rect x="340" y="198" width="60" height="34" fill="#f58518"/>
      <rect x="400" y="198" width="60" height="34" fill="#54a24b"/>
      <rect x="460" y="198" width="120" height="34" fill="#e45756"/>
      <rect x="580" y="198" width="120" height="34" fill="#b279a2"/>
      <text x="713" y="222" font-size="16" font-weight="700">8</text>

      <!-- BadScientist: 1 + 1 + 2 + 2 + 1 = 7 -->
      <rect x="220" y="263" width="60" height="34" fill="#4c78a8"/>
      <rect x="280" y="263" width="60" height="34" fill="#f58518"/>
      <rect x="340" y="263" width="120" height="34" fill="#54a24b"/>
      <rect x="460" y="263" width="120" height="34" fill="#e45756"/>
      <rect x="580" y="263" width="60" height="34" fill="#b279a2"/>
      <text x="653" y="287" font-size="16" font-weight="700">7</text>

      <!-- CORE-Bench: 2 + 1 + 1 + 0 + 1 = 5 -->
      <rect x="220" y="328" width="120" height="34" fill="#4c78a8"/>
      <rect x="340" y="328" width="60" height="34" fill="#f58518"/>
      <rect x="400" y="328" width="60" height="34" fill="#54a24b"/>
      <rect x="460" y="328" width="60" height="34" fill="#b279a2"/>
      <text x="533" y="352" font-size="16" font-weight="700">5</text>

      <!-- SPOT: 0 + 0 + 0 + 2 + 0 = 2 -->
      <rect x="220" y="393" width="120" height="34" fill="#e45756"/>
      <text x="353" y="417" font-size="16" font-weight="700">2</text>
    </g>

    <line x1="220" y1="455" x2="820" y2="455" stroke="#555555" stroke-width="1.5"/>
    <text x="40" y="515" font-size="12" fill="#666666">Scores are project-specific analytical judgments documented in the accompanying table, not benchmark-author results.</text>
  </g>
</svg>
