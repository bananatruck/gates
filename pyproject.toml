[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gates-validity-layer"
version = "0.2.0"
description = "G.A.T.E.S. — a portable validity layer that prevents autonomous research agents from reporting results they never measured"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []  # stdlib only, on purpose: it must drop into any scaffold's env

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["gates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py310"
cache-dir = ".cache/ruff"
# The signed package holds captured agent code; linting it would mean editing evidence.
extend-exclude = ["reports", "build"]

[tool.ruff.lint]
# Correctness and bug-risk rules, plus a few simplifications. Line length is not enforced.
select = ["F", "B", "SIM", "UP", "RET"]
# A nested ternary reads worse than the if/else it would replace.
ignore = ["SIM108"]
