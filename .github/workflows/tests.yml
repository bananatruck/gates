name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

  stdlib-only:
    name: Verify the runtime stays stdlib-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the package without its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fail if anything third-party was pulled in
        run: |
          python -m pip freeze --exclude-editable > installed.txt
          if [ -s installed.txt ]; then
            echo "The runtime is supposed to be stdlib-only, but pip installed:"
            cat installed.txt
            exit 1
          fi
          echo "No third-party runtime dependencies."

      - name: Import every runtime module on a bare interpreter
        run: >-
          python -c "import pkgutil, importlib, gates;
          [importlib.import_module(m.name)
          for m in pkgutil.walk_packages(gates.__path__, 'gates.')]"
